# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/directd"
framework = ">= 0.57"
profiles = ["conventional", "performance"]

[permissions]
# It calls the Direct Data API (https://apiv3.directd.com.br) over HTTPS, one
# GET per query, with the token in the query string as the API requires. Every
# such call is billed to the token's owner. Nothing else leaves the process.
# cmd/directd-catalog reads the public documentation and cmd/directd-smoke
# makes capped real calls; both are programs an application never links.
network = true
# It reads and writes no file. cmd/directd-smoke reads the token file and
# writes redacted answers, and cmd/directd-catalog writes the catalogue; an
# application never links either.
filesystem = false
# It runs no other program.
exec = false
# It owns no table. Balance, holds and remembered results live in the
# application, behind the Ledger and Dedupe interfaces.
migrations = false
